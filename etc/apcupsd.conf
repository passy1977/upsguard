# /etc/upsguard/apcupsd.conf - apcupsd configuration used by upsguard
#
# APC Back-UPS BX750MI on USB. Used by the upsguard runit service instead of
# /etc/apcupsd/apcupsd.conf. See apcupsd.conf(5).

UPSNAME BX750MI
UPSCABLE usb
UPSTYPE usb
DEVICE

LOCKFILE /var/lock
# Events go to /etc/upsguard/apccontrol -> upsguard-event
SCRIPTDIR /etc/upsguard
# Same directory as the package: /etc/runit/shutdown.d/89-apcupsd-powerfail.sh
# looks for the powerfail flag here and switches off the UPS at the end of the shutdown
PWRFAILDIR /etc/apcupsd
NOLOGINDIR /etc

# ---------------------------------------------------------- shutdown on battery
# The shutdown starts when the first limit is reached.

# Seconds on battery before the onbattery event
ONBATTERYDELAY 6
# Remaining charge (%)
BATTERYLEVEL 20
# Remaining runtime estimated by the UPS (minutes)
MINUTES 5
# Maximum time on battery (seconds, 0 = disabled)
TIMEOUT 0

# No "please log off" messages
ANNOY 0
NOLOGON disable
KILLDELAY 0

# --------------------------------------------- network server (for apcaccess)

NETSERVER on
NISIP 127.0.0.1
NISPORT 3551

EVENTSFILE /var/log/apcupsd.events
EVENTSFILEMAX 10

UPSCLASS standalone
UPSMODE disable
